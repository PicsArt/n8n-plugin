name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-checks:
    name: Quality Checks (Lint & Build)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        run: |
          if [ ! -f package.json ]; then
            find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            git init .
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git fetch --depth=1 origin "${GITHUB_SHA}"
            git checkout FETCH_HEAD
          fi
          ls -la
          test -f package.json
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Node.js and pnpm
        run: |
          node --version
          NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")
          if [ "$NODE_MAJOR" -lt 20 ]; then
            echo "Node.js 20+ is required (engines in package.json). Found: $(node -v)"
            exit 1
          fi
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: npm run lint

      - name: Build package
        run: npm run build

  publish:
    name: Publish to NPM
    needs: quality-checks
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        run: |
          if [ ! -f package.json ]; then
            find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            git init .
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git fetch --depth=1 origin "${GITHUB_SHA}"
            git checkout FETCH_HEAD
          fi
          ls -la
          test -f package.json
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Node.js and pnpm
        run: |
          node --version
          NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")
          if [ "$NODE_MAJOR" -lt 20 ]; then
            echo "Node.js 20+ is required (engines in package.json). Found: $(node -v)"
            exit 1
          fi
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: npm run build

      - name: Configure npm registry
        run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CI_CD }}

      - name: Publish to NPM with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CI_CD }}

  scan-published-package:
    name: Scan Published NPM Package
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - name: Setup Node.js
        run: |
          node --version
          NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")
          if [ "$NODE_MAJOR" -lt 20 ]; then
            echo "Node.js 20+ is required. Found: $(node -v)"
            exit 1
          fi

      - name: Wait for NPM to propagate
        run: sleep 30

      - name: Scan published package from NPM
        run: npx @n8n/scan-community-package @picsart/n8n-nodes-picsart-creative-apis
        continue-on-error: true
